# my global config
global:
  scrape_interval:     30s # By default, scrape targets every 30 seconds.
  evaluation_interval: 30s # By default, scrape targets every 30 seconds.
  scrape_timeout: 10s # scrape_timeout is set to the global default (10s).

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:

  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]  # or "icmp"
    static_configs:
      - targets:
        - https://google.com
        - https://github.com
        - https://cloudflare.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115  # blackbox exporter address
  
  - job_name: 'blackbox-icmp'
    scrape_interval: 30s
    scrape_timeout: 15s
    metrics_path: /probe
    params:
      module: [icmp_ping]
    static_configs:
      - targets:
          - 8.8.4.4
          - 8.8.8.8
          - 1.1.1.1
          - 1.0.0.1
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: 'prometheus'
    static_configs:
      - targets:
        - 'prometheus:9090'

  - job_name: 'prometheus-router'
    static_configs:
      - targets:
        - '10.100.0.1:9100'

  - job_name: 'homeassistant'
    basic_auth:
      username: admin
      password: admin
    static_configs:
      - targets:
        - 'svr-frigg.jotunheim.onyxnet.lan:9100'

  - job_name: 'pihole'
    metrics_path: /metrics
    static_configs:
      - targets:
          - '10.100.0.11:9617'
        labels:
          role: 'primary'

      - targets:
          - '10.100.0.29:9617'
        labels:
          role: 'secondary'

      - targets:
          - '10.100.0.10:9617'
        labels:
          role: 'tertiary'

      - targets:
          - '10.100.0.28:9617'
        labels:
          role: 'quarternary'

  - job_name: 'pve'
    metrics_path: /pve
    params:
      module: [default]
    static_configs:
      - targets:
          - 'svr-aesir1.asgard.onyxnet.lan:9221'
          - 'svr-aesir2.asgard.onyxnet.lan:9221'
          - 'svr-aesir3.asgard.onyxnet.lan:9221'
        labels:
          cluster: 'aesir'

      - targets:
          - 'svr-vanir1.asgard.onyxnet.lan:9221'
        labels:
          cluster: 'vanir'

  - job_name: 'blackbox-switches'
    metrics_path: /probe
    params:
      module: [icmp_ping]
    static_configs:
      - targets:
          - 10.10.0.8
        labels:
          switch: 'Upstairs'
      - targets:
          - 10.10.0.7
        labels:
          switch: 'Downstairs 1'
      - targets:
          - 10.10.0.6
        labels:
          switch: 'Downstairs 2'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: 'blackbox-aps'
    metrics_path: /probe
    params:
      module: [icmp_ping]
    static_configs:
      - targets:
          - 10.10.0.30
        labels:
          ap: 'upstairs'
      - targets:
          - 10.10.0.29
        labels:
          ap: 'Downstairs'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: 'blackbox-dns'
    metrics_path: /probe
    params:
      module: [icmp_ping]
    static_configs:
      - targets:
        - 10.100.0.9
        labels:
          dns: 'primary-vip'
      - targets:
        - 10.100.0.8
        labels:
          dns: 'secondary-vip'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: 'unifipoller'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'unpoller:9130'

  - job_name: 'blackbox-vlan-gateways'
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /probe

    params:
      module: [icmp_ping]

    static_configs:
      - targets:
          - 10.10.0.1
        labels:
          vlan: '10'
          vlan_name: 'Valhalla'
          purpose: 'Management'

      - targets:
          - 10.10.25.1
        labels:
          vlan: '25'
          vlan_name: 'Jotunheim'
          purpose: 'IoT'

      - targets:
          - 10.10.50.1
        labels:
          vlan: '50'
          vlan_name: 'Helheim'
          purpose: 'Security'

      - targets:
          - 192.168.0.1
        labels:
          vlan: '99'
          vlan_name: 'Vanaheim'
          purpose: 'Guest'

      - targets:
          - 10.10.10.1
        labels:
          vlan: '100'
          vlan_name: 'Midgard'
          purpose: 'Trusted'

      - targets:
          - 10.100.0.1
        labels:
          vlan: '1000'
          vlan_name: 'Asgard'
          purpose: 'Servers'

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox:9115

  - job_name: 'blackbox-applications'
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /prometheus/targets/applications-frontend.yml
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: 'blackbox-applications-direct'
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /prometheus/targets/applications-direct.yml
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  
  - job_name: 'blackbox-applications-internal-tls'
    metrics_path: /probe
    params:
      module: [http_internal_tls]
    file_sd_configs:
      - files:
          - /prometheus/targets/applications-internal-tls.yml
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115